<div class="inside-border">
  <div class="header">
    <span class="card-title">{{context?.$implicit?.nomFormation}}</span>
    <span class="card-date">
        {{context?.$implicit?.dateDebut}} - {{context?.$implicit?.dateFin || 'Present'}}
    </span>

  </div>

  <div class="card-content">
    <ng-container
      *ngTemplateOutlet="content; context: context">
    </ng-container>
  </div>

</div>
